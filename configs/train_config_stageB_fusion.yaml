# VLM-FO1 宫颈细胞 Pathology Early Fusion 阶段B（LoRA 微调）配置

model:
  base_model: "resources/VLM-FO1_Qwen2.5-VL-3B-v01"

data:
  train_json: "/home/nas3/biod/shiyu/data/data_vl_20260115/vlm_fo1_data/dataset/final/stage2_train.json"
  test_json: "/home/nas3/biod/shiyu/data/data_vl_20260115/vlm_fo1_data/dataset/final/stage2_val.json"
  image_size: 896
  max_regions: 100
  path_feature_root: "/home/nas3/biod/shiyu/data/data_vl_20260115/path_features"

training:
  output_dir: "outputs/cervical_PAfull_B_fusion"
  phase: "full"
  num_epochs: 3
  batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.00002
  warmup_steps: 50
  save_steps: 500
  eval_steps: 500
  logging_steps: 10
  save_total_limit: 10
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false

  # Stage-B 训练模块：
  # - lora_layers: 由 lora.target_modules 控制（q_proj/v_proj）
  # - path_encoder/fusion_layer/mm_projector: 融合路径继续微调
  trainable_modules:
    - lora_layers
    - "path_encoder"
    - "mm_projector_path"
    - "mm_projector_aux"

  optimizer:
    type: "adamw_torch"
    weight_decay: 0.01
  lr_scheduler:
    type: "cosine"
    warmup_ratio: 0.15

  # 小权重辅助损失（避免过强约束引起梯度冲突）
  aux_loss:
    log_every_steps: 50
    region_loss_weight: 0.05
    cls_loss_weight: 0.05
    region_loss_weight_by_task: {}
    cls_loss_weight_by_task: {}

lora:
  enabled: true
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules: ["q_proj", "v_proj"]

freeze:
  vision_tower: true
  language_model_layers: []

hardware:
  device: "cuda"
  mixed_precision: "bf16"
  dataloader_num_workers: 1
  dataloader_pin_memory: true

misc:
  seed: 42
  max_grad_norm: 1.0
  report_to: "wandb"
  run_name: "cervical_cell_stageB_feature_fusion_lora"

wandb:
  project: "vlm-fo1-cervical"
  entity: null
  name: null
  tags: ["cervical", "vlm-fo1", "stageB", "early-fusion", "lora"]
  notes: "StageB feature-fusion full finetune: LoRA(q_proj,v_proj) + fusion-path modules"

