# StageB: CoT 推理注入（更小 LoRA，只调 Attention，保持 StageA 领域知识）

model:
  # StageA 训练得到的 checkpoint（完整模型或 LoRA 合并后的目录）
  base_model: "./outputs/stage1_layerGated_taskAdaptive"
  # 若 base_model 目录下为 LoRA 适配器，则先加载 VLM-FO1 基座再加载该 LoRA
  load_stageA_lora: true
  # 方案一：Layer-wise Attention Fusion（HFRE增强）
  use_hierarchical_fusion: true
  hierarchical_num_heads: 8
  hierarchical_fusion_mode: "task_adaptive"   # legacy | task_adaptive | gated | mean | weighted

data:
  train_json: "/home/nas3/biod/shiyu/data/data_vl_20260115/vlm_fo1_data/dataset/balance/stage2_cot_train.json"
  val_json: "/home/nas3/biod/shiyu/data/data_vl_20260115/vlm_fo1_data/dataset/balance/stage2_cot_val.json"
  image_size: 896
  max_regions: 100
  path_feature_root: null
  language: "zh"   # "zh" 中文约束 | "en" 英文约束

  # 混合 StageA 数据（缓解遗忘）
  # mix_stageA_data: true
  # stageA_data_ratio: 0.3
  # stageA_train_json: "/home/nas3/biod/shiyu/data/data_vl_20260115/vlm_fo1_data/dataset/cot/stage1_align_train.json"

training:
  phase: "cot_injection"
  output_dir: "outputs/stage2_layerGated_taskAdaptive"

  num_epochs: 1
  batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.00005
  warmup_ratio: 0.1

  save_steps: 1000
  eval_steps: 1000
  logging_steps: 10
  save_total_limit: 5

  weight_decay: 0.1
  label_smoothing: 0.05

  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  early_stopping_patience: 3

  # StageB 训练 LoRA（attention）+ hierarchical_fusion（通过 PEFT modules_to_save 保存全量门控参数）
  trainable_modules:
    - "lora_layers"
    - "model.object_vp_extractor.hierarchical_fusion"
  # hierarchical_fusion 使用更小学习率，避免破坏 StageA 已学门控（实际 lr = learning_rate * gate_lr_ratio）
  gate_lr_ratio: 0.2

lora:
  enabled: true
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
  # 不调 MLP，保持 StageA 学到的领域知识

freeze:
  vision_tower: true
  vision_projector: true
  region_projector: true
  llm_mlp: true
  llm_attention: false   # 通过 LoRA 微调 attention

hardware:
  device: "cuda"
  mixed_precision: "bf16"
  gradient_checkpointing: true
  dataloader_num_workers: 4
  dataloader_pin_memory: true

misc:
  seed: 42
  max_grad_norm: 1.0
  report_to: "wandb"   # "wandb" 时训练/验证 loss 会传到 wandb；改为 "tensorboard" 则只用本地 tensorboard
  run_name: "stageB_cot_lora"

# wandb 仅在 report_to: "wandb" 时生效
wandb:
  project: "vlm-fo1-cervical"
  entity: null
  name: null   # 不设则用 misc.run_name
  tags: ["stageB", "cot", "lora"]
  notes: ""
