# VLM-FO1 宫颈细胞定位第二阶段微调配置文件

# 模型配置
model:
  base_model: "resources/VLM-FO1_Qwen2.5-VL-3B-v01"
  # 第一阶段微调后的模型路径（包含LoRA权重）
  # stage1_model: "outputs/cervical_finetune0115"

# 数据配置
data:
  # train_json: "dataset/data20260115/stage2_train.json"
  # test_json: "dataset/data20260115/stage2_val.json"  
  train_json: "/home/nas3/biod/shiyu/data/data_vl_20260115/sample1000/vl_data/stage2_train_sample1000.json"
  test_json: "/home/nas3/biod/shiyu/data/data_vl_20260115/sample1000/vl_data/stage2_val_sample500.json"
  image_size: 896  # 图像尺寸
  max_regions: 100  # 最大区域数量
  # 使用HoVer-Net预处理得到的病理特征目录（可选）
  path_feature_root: "/home/nas3/biod/shiyu/data/data_vl_20260115/sample1000/path_features"

# 训练配置
training:
  output_dir: "outputs/cervical_PA1000_A"
  num_epochs: 3  # 第二阶段通常训练更少的epoch
  batch_size: 1  # 根据GPU内存调整
  gradient_accumulation_steps: 8  # 有效batch_size = batch_size * gradient_accumulation_steps
  learning_rate: 0.00002  # 第二阶段使用更小的学习率（第一阶段的一半）
  # warmup_steps: 100  # 预热步数
  # save_steps: 500  # 保存checkpoint的步数间隔
  # eval_steps: 100  # 评估的步数间隔
  # logging_steps: 100  # 日志记录的步数间隔
  warmup_steps: 50  # 预热步数
  save_steps: 50  # 保存checkpoint的步数间隔
  eval_steps: 50  # 评估的步数间隔
  logging_steps: 10  # 日志记录的步数间隔
  save_total_limit: 10  # 最多保存的checkpoint数量
  load_best_model_at_end: true  # 训练结束时加载最佳模型
  metric_for_best_model: "eval_loss"  # 用于选择最佳模型的指标
  greater_is_better: false  # loss越小越好
  # 训练阶段：full（当前LoRA阶段2全流程，包含PA-FFE）、paffe_align（仅对齐PA-FFE + mm_projector_aux）
  phase: "full"
  
  # 优化器配置
  optimizer:
    type: "adamw_torch"  # 优化器类型
    weight_decay: 0.01  # 权重衰减
  
  # 学习率调度器配置
  lr_scheduler:
    type: "cosine"  # 调度器类型：linear, cosine, constant
    warmup_ratio: 0.15  # 预热比例（相对于总步数）

# LoRA配置（继续使用LoRA微调）
lora:
  enabled: true  # 是否启用LoRA微调
  r: 8  # LoRA rank（保持与第一阶段相同）
  alpha: 16  # LoRA alpha（保持与第一阶段相同）
  dropout: 0.05  # LoRA dropout
  target_modules: null  # LoRA目标模块，null表示使用默认值

# 冻结参数配置（仅在非LoRA模式下使用）
freeze:
  vision_tower: true  # 是否冻结视觉编码器
  language_model_layers: []  # 不冻结语言模型层

# 硬件配置
hardware:
  device: "cuda"  # 设备：cuda 或 cpu
  mixed_precision: "bf16"  # 混合精度：bf16, fp16 或 no
  dataloader_num_workers: 1  # 数据加载器工作进程数
  dataloader_pin_memory: true  # 是否固定内存

# 其他配置
misc:
  seed: 42  # 随机种子
  max_grad_norm: 1.0  # 梯度裁剪阈值
  report_to: "wandb"  # 日志报告工具：tensorboard, wandb, none
  run_name: "cervical_cell_finetune_stage2"  # 运行名称
  
# Wandb配置（当report_to为wandb时使用）
wandb:
  project: "vlm-fo1-cervical"  # Wandb项目名称
  entity: null  # Wandb实体/团队名称，null表示使用默认
  name: null  # Wandb运行名称，null表示使用run_name
  tags: ["cervical", "vlm-fo1", "lora", "stage2"]  # Wandb标签
  notes: "VLM-FO1宫颈细胞定位第二阶段微调"  # Wandb运行说明

