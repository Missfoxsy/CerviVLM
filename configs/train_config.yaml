# VLM-FO1 宫颈细胞定位微调配置文件

# 模型配置
model:
  base_model: "resources/VLM-FO1_Qwen2.5-VL-3B-v01"
  # 如果使用HuggingFace模型ID，取消下面的注释
  # base_model: "omlab/VLM-FO1_Qwen2.5-VL-3B-v01"

# 数据配置
data:
  train_json: "dataset/data20260115/stage1_train_region_text.json"
  test_json: "dataset/data20260115/stage1_val_region_text.json"  # 测试集路径（如果已划分好）
  image_size: 896  # 图像尺寸，减小以节省显存（原1024，现896）
  max_regions: 100  # 最大区域数量

# 训练配置
training:
  output_dir: "outputs/cervical_finetune0115_multitask"
  num_epochs: 5
  batch_size: 1  # 根据GPU内存调整，建议1-4
  gradient_accumulation_steps: 8  # 有效batch_size = batch_size * gradient_accumulation_steps
  learning_rate: 0.0001  # 学习率，LoRA模式下建议0.0001(1e-4)，全参数微调建议0.00002(2e-5)
  warmup_steps: 100  # 预热步数
  save_steps: 500  # 保存checkpoint的步数间隔
  eval_steps: 500  # 评估的步数间隔
  logging_steps: 50  # 日志记录的步数间隔
  save_total_limit: 3  # 最多保存的checkpoint数量
  load_best_model_at_end: true  # 训练结束时加载最佳模型
  metric_for_best_model: "eval_loss"  # 用于选择最佳模型的指标
  greater_is_better: false  # loss越小越好
  
  # 优化器配置
  optimizer:
    type: "adamw_torch"  # 优化器类型
    weight_decay: 0.01  # 权重衰减
  
  # 学习率调度器配置
  lr_scheduler:
    type: "cosine"  # 调度器类型：linear, cosine, constant
    warmup_ratio: 0.1  # 预热比例（相对于总步数）

# LoRA配置
lora:
  enabled: true  # 是否启用LoRA微调
  r: 8  # LoRA rank
  alpha: 16  # LoRA alpha
  dropout: 0.05  # LoRA dropout
  target_modules: null  # LoRA目标模块，null表示使用默认值
  # 默认目标模块: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  # 也可以自定义，例如: "q_proj,k_proj,v_proj,o_proj"

# 冻结参数配置（仅在非LoRA模式下使用）
freeze:
  vision_tower: true  # 是否冻结视觉编码器（LoRA模式下，如果为false，视觉编码器可训练）
  language_model_layers: [0, 1, 2, 3, 4, 5]  # 冻结的语言模型层索引（可选，LoRA模式下不使用）
  # 如果不想冻结语言模型层，设置为空列表：[]

# 硬件配置
hardware:
  device: "cuda"  # 设备：cuda 或 cpu
  mixed_precision: "bf16"  # 混合精度：bf16, fp16 或 no
  dataloader_num_workers: 1  # 数据加载器工作进程数
  dataloader_pin_memory: true  # 是否固定内存

# 其他配置
misc:
  seed: 42  # 随机种子
  max_grad_norm: 1.0  # 梯度裁剪阈值
  report_to: "wandb"  # 日志报告工具：tensorboard, wandb, none
  run_name: "cervical_cell_finetune"  # 运行名称
  
# Wandb配置（当report_to为wandb时使用）
wandb:
  project: "vlm-fo1-cervical"  # Wandb项目名称
  entity: null  # Wandb实体/团队名称，null表示使用默认
  name: null  # Wandb运行名称，null表示使用run_name
  tags: ["cervical", "vlm-fo1", "lora"]  # Wandb标签
  notes: "VLM-FO1宫颈细胞定位微调"  # Wandb运行说明

