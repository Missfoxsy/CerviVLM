# VLM-FO1 宫颈细胞 Pathology Token 阶段A（对齐阶段）配置文件

# 模型配置
model:
  base_model: "resources/VLM-FO1_Qwen2.5-VL-3B-v01"

# 数据配置（与阶段B一致，便于对齐）
data:
  train_json: "/home/nas3/biod/shiyu/data/data_vl_20260115/vlm_fo1_data/dataset/stage/stageA_train.json"
  test_json: "/home/nas3/biod/shiyu/data/data_vl_20260115/vlm_fo1_data/dataset/stage/stageA_val.json"
  image_size: 896          # 图像尺寸
  max_regions: 100         # 最大区域数量
  # 使用HoVer-Net预处理得到的病理特征目录
  path_feature_root: "/home/nas3/biod/shiyu/data/data_vl_20260115/path_features"

# 训练配置（阶段A：Path Token 对齐）
training:
  output_dir: "outputs/cervical_PAfull_A"
  # 对齐阶段只训练较少参数，可以适当增大学习率、略多跑一点轮次
  num_epochs: 3              # 如果继续训练阶段A，可以增加到5个epoch
  batch_size: 1               # 根据GPU内存调整
  gradient_accumulation_steps: 8  # 有效batch_size = batch_size * gradient_accumulation_steps
  learning_rate: 0.0001       # 阶段A：仅对 path_encoder/mm_projector_path 等小模块，用稍大的 lr
  warmup_steps: 50            # 预热步数
  save_steps: 500              # 保存checkpoint的步数间隔
  eval_steps: 500              # 评估的步数间隔
  logging_steps: 10           # 日志记录的步数间隔
  save_total_limit: 10        # 最多保存的checkpoint数量
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  # 训练阶段：
  # - paffe_align：仅训练 pathology token 模块（path_encoder/mm_projector_path/path_type_embed）
  phase: "paffe_align"
  # DDP init_process_group timeout（秒）；阶段A单 step/评估可能很慢，建议调大避免 30min watchdog 超时
  ddp_timeout: 7200
  
  # 优化器配置
  optimizer:
    type: "adamw_torch"
    weight_decay: 0.01
  
  # 学习率调度器配置
  lr_scheduler:
    type: "cosine"            # 如果继续训练，建议改为 "constant" 或 "linear" 避免lr衰减到0
    warmup_ratio: 0.15

# LoRA配置（阶段A 不启用 LoRA，只训练 Path Token 模块）
lora:
  enabled: false
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules: null

# 冻结参数配置（仅在非LoRA模式下使用，这里主要控制视觉塔是否解冻）
freeze:
  vision_tower: true           # 阶段A 冻结视觉编码器
  language_model_layers: []    # 不额外冻结某些层（整体已经在脚本中 freeze all，再精细打开 Path Token 模块）

# 硬件配置
hardware:
  device: "cuda"
  mixed_precision: "bf16"
  dataloader_num_workers: 1
  dataloader_pin_memory: true

# 其他配置
misc:
  seed: 42
  max_grad_norm: 1.0
  report_to: "wandb"
  run_name: "cervical_cell_stage2A_path_token_align"
  
# Wandb配置
wandb:
  project: "vlm-fo1-cervical"
  entity: null
  name: null
  tags: ["cervical", "vlm-fo1", "stage2A", "pathology-token", "align"]
  notes: "Stage2-A: Pathology Token 对齐，仅训练 path_encoder/mm_projector_path/path_type_embed"

