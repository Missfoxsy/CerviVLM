# PS3C few-shot 二分类微调（从 Stage2 checkpoint 继续训练）
# 路径由 scripts/run_ps3c_fewshot.sh 通过环境变量覆盖 train_json / val_json / output_dir

model:
  base_model: "./outputs/stage2_layerGated_taskAdaptive"
  load_stageA_lora: true
  use_hierarchical_fusion: true
  hierarchical_num_heads: 8
  hierarchical_fusion_mode: "task_adaptive"

data:
  train_json: "/home/nas3/biod/shiyu/data/data_vl_20260115/PS3C/ps3c_5shot_seed1.json"
  val_json: "/home/nas3/biod/shiyu/data/data_vl_20260115/PS3C/ps3c_5shot_seed1_test.json"
  image_size: 896
  max_regions: 1
  path_feature_root: null
  language: "zh"
  enrich_cache_dir: "outputs/ps3c_fewshot_cache"

training:
  phase: "ps3c_fewshot"
  output_dir: "outputs/ps3c_5shot_seed1_finetune"

  num_epochs: 5
  batch_size: 1
  gradient_accumulation_steps: 2
  learning_rate: 0.0002
  warmup_ratio: 0.05

  save_steps: 10
  eval_steps: 10
  logging_steps: 2
  save_total_limit: 3

  weight_decay: 0.01
  label_smoothing: 0.0

  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  early_stopping_patience: 8

  # few-shot 仅微调 LoRA，避免小样本下门控过拟合
  trainable_modules:
    - "lora_layers"
  gate_lr_ratio: 0.0

lora:
  enabled: true
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"

freeze:
  vision_tower: true
  vision_projector: true
  region_projector: true
  llm_mlp: true
  llm_attention: false

hardware:
  device: "cuda"
  mixed_precision: "bf16"
  gradient_checkpointing: true
  dataloader_num_workers: 2
  dataloader_pin_memory: true

misc:
  seed: 42
  max_grad_norm: 1.0
  report_to: "tensorboard"
  run_name: "ps3c_5shot_fewshot"
