# Stage2 Baseline：跳过 Stage1，直接从官方 VLM-FO1 基座微调 LoRA
# 不启用层级注意力（HierarchicalFeatureFusion）与门控（task_adaptive / gated）
# VT 区域特征走官方默认路径：SimpleFPN 4 层 ROI → concat（2048 维）

model:
  base_model: "resources/VLM-FO1_Qwen2.5-VL-3B-v01"
  load_stageA_lora: false
  use_hierarchical_fusion: false

data:
  train_json: "/home/nas3/biod/shiyu/data/data_vl_20260115/vlm_fo1_data/dataset/balance/stage2_cot_train.json"
  # val_json: "/home/nas3/biod/shiyu/data/data_vl_20260115/vlm_fo1_data/dataset/balance/stage2_cot_val.json"
  image_size: 896
  max_regions: 100
  path_feature_root: null
  language: "zh"

training:
  phase: "cot_injection"
  output_dir: "outputs/stage2_baseline_no_stage1"

  num_epochs: 1
  batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.00005
  warmup_ratio: 0.1

  save_steps: 1000
  logging_steps: 10
  save_total_limit: 5

  weight_decay: 0.1
  label_smoothing: 0.05

  load_best_model_at_end: false

  trainable_modules:
    - "lora_layers"

lora:
  enabled: true
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"

freeze:
  vision_tower: true
  vision_projector: true
  region_projector: true
  llm_mlp: true
  llm_attention: false

hardware:
  device: "cuda"
  mixed_precision: "bf16"
  gradient_checkpointing: true
  dataloader_num_workers: 4
  dataloader_pin_memory: true

misc:
  seed: 42
  max_grad_norm: 1.0
  report_to: "wandb"
  run_name: "stageB_baseline_no_stage1"

wandb:
  project: "vlm-fo1-cervical"
  entity: null
  name: null
  tags: ["stageB", "cot", "lora", "baseline", "no_stage1", "no_hierarchical_fusion"]
  notes: "Baseline: VLM-FO1 + Stage2 LoRA only, no hierarchical attention or gating."
